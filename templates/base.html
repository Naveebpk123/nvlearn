<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css')}}">
        <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
        <title>{% block title %}NVLearn{% endblock %}</title>
    </head>
    <body class="site-layout">
        <nav>
            <img src="{{url_for('static',filename='assets/logo.png')}}" alt="logo" class="logo" id="logo" title="Toggle sidebar">

            {% if current_user.is_authenticated %}
                <input type="text" placeholder="Search..." class="search-bar" id="searchBar">
            {% endif %}
        </nav>
        <div class="page-layout">
            <aside class="sidebar" id="sidebar">

                <a class="sidebar-item" href="{{url_for('home')}}">
                    🏠 Home
                </a>
                {% if current_user.is_authenticated %}
                    <a class="sidebar-item" href="{{url_for('notes')}}">
                        📚 Notes
                    </a>

                    <a class="sidebar-item" href="{{url_for('note_bin')}}">
                        🗑️ Bin
                    </a>
                    <a class="sidebar-item" href="{{url_for('ai_chat')}}">
                        ✨ NVLearn AI
                    </a>
                    <a class="sidebar-item" href="{{url_for('practice_hub')}}">
                        🎯 Practice Hub
                    </a>
                    <button class="sidebar-item" id="sidebarLogout" >
                        ➜] Logout
                    </button>
                {% else %}
                    <a class="sidebar-item" href="{{url_for('register')}}">
                        📝 Register
                    </a>

                    <a class="sidebar-item" href="{{url_for('login')}}">
                        ➜] Login
                    </a>
                {% endif %}
                <a class="sidebar-item" href="{{url_for('about')}}">
                    ℹ️ About
                </a>
            </aside>
            <main class="content-wrapper sidebar-open" id="contentWrapper">
                <div id="notificationBar"></div>

                {% block content %}
                {% endblock %}
            </main>
        </div>
        <div class="modal-bg" id="modalBackground" style="display:none;">
            <div class="confirm-modal" id="confirmModal">
                <p class="modal-text" id="modalText"></p>
                <div class="modal-btns">
                    <button id="modalConfirmBtn" class="button">Confirm</button>
                    <button id="modalCancelBtn" class="button cancel">Cancel</button>
                </div>
            </div>
        </div>
        <div class="diagram-modal-bg" id="diagramModal" style="display:none;">
            <div class="diagram-modal-content" id="diagramModalContent">
                <div class="diagram-modal-header">
                    <span class="diagram-modal-title">Diagram Editor</span>
                    <div class="diagram-modal-actions">
                        <button type="button" class="diagram-btn" id="diagramFullscreenBtn" title="Toggle Fullscreen">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                            </svg>
                        </button>
                        <button type="button" class="diagram-btn close-btn" id="closeDiagramBtn" title="Close Editor">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="diagram-modal-body">
                    <iframe id="drawioFrame" src="about:blank" title="Draw.io Diagram Editor"></iframe>
                </div>
            </div>
        </div>
        <script src="{{url_for('static',filename='js/script.js')}}"></script>
        <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.3/dist/turndown.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script>
            /**
             * Global state variables for tracking active diagram editing session.
             * - activeDiagramImg: Reference to the HTML <img> element being edited (null if creating new).
             * - activeDiagramData: Data URI (xmlpng) string of the active diagram for loading into Draw.io.
             * - activeDiagramId: Database ID of the diagram stored in backend.
             */
            let activeDiagramImg = null;
            let activeDiagramData = null;
            let activeDiagramId = null;

            /**
             * Opens the Draw.io diagram editor modal.
             * @param {HTMLElement|null} imgElement - Optional <img> element if re-editing an existing diagram.
             */
            async function openDiagramEditor(imgElement) {
                const modal = document.getElementById('diagramModal');
                const iframe = document.getElementById('drawioFrame');

                if (!modal || !iframe) return;

                // Check if an existing diagram image was passed for editing
                if (imgElement && imgElement.tagName === 'IMG') {
                    activeDiagramImg = imgElement;
                    activeDiagramId = imgElement.getAttribute('data-diagram-id') || imgElement.getAttribute('data-id') || null;
                    const src = imgElement.getAttribute('src') || '';

                    if (src.startsWith('data:image/')) {
                        activeDiagramData = src;
                    } else if (activeDiagramId) {
                        try {
                            const res = await fetch(`/diagram_data/${activeDiagramId}`);
                            const data = await res.json();
                            if (data.status === 'success') {
                                activeDiagramData = data.diagram_data;
                            } else {
                                activeDiagramData = null;
                            }
                        } catch (err) {
                            console.error('Error fetching diagram data:', err);
                            activeDiagramData = null;
                        }
                    } else {
                        activeDiagramData = null;
                    }
                } else {
                    activeDiagramImg = null;
                    activeDiagramData = null;
                    activeDiagramId = null;
                }

                // Set iframe src to load Draw.io with postMessage protocol enabled
                const drawUrl = 'https://embed.diagrams.net/?embed=1&spin=1&proto=json&libraries=1';
                iframe.src = drawUrl;
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden'; // Lock background scrolling
            }

            /**
             * Closes the Draw.io diagram editor modal and resets session state.
             */
            function closeDiagramEditor() {
                const modal = document.getElementById('diagramModal');
                const modalContent = document.getElementById('diagramModalContent');
                const iframe = document.getElementById('drawioFrame');

                if (modal) modal.style.display = 'none';
                if (iframe) iframe.src = 'about:blank'; // Clear iframe to free memory
                document.body.style.overflow = '';
                if (modalContent) modalContent.classList.remove('fullscreen');

                // Reset active diagram session state
                activeDiagramImg = null;
                activeDiagramData = null;
                activeDiagramId = null;
            }

            /**
             * Handles postMessage communication events received from the Draw.io iframe.
             */
            window.addEventListener('message', async function(event) {
                // Verify origin for security
                if (event.origin !== 'https://embed.diagrams.net') return;

                try {
                    const msg = JSON.parse(event.data);
                    const iframe = document.getElementById('drawioFrame');

                    // Event 1: Draw.io frame initialization completed
                    if (msg.event === 'init') {
                        if (iframe && iframe.contentWindow) {
                            const loadMsg = { action: 'load' };
                            if (activeDiagramData) {
                                // Load existing diagram XML/PNG data onto canvas
                                loadMsg.xmlpng = activeDiagramData;
                                loadMsg.xml = activeDiagramData;
                            } else {
                                // Load blank canvas for new diagram
                                loadMsg.xml = '';
                            }
                            iframe.contentWindow.postMessage(JSON.stringify(loadMsg), '*');
                        }
                    }
                    // Event 2: User clicked Save inside Draw.io UI
                    else if (msg.event === 'save') {
                        if (iframe && iframe.contentWindow) {
                            // Request export in xmlpng format (preserves editable XML in PNG metadata)
                            iframe.contentWindow.postMessage(JSON.stringify({
                                action: 'export',
                                format: 'xmlpng'
                            }), '*');
                        }
                    }
                    // Event 3: Draw.io completed image export
                    else if (msg.event === 'export') {
                        const imgUrl = msg.data || ('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(msg.xml));

                        const payload = {
                            img_data: imgUrl
                        };
                        if (activeDiagramId) {
                            payload.id = activeDiagramId;
                        }

                        try {
                            // Send async request to save diagram on backend
                            const response = await fetch('/save_diagram', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(payload)
                            });

                            if (!response.ok) {
                                throw new Error('Server returned error status ' + response.status);
                            }

                            const data = await response.json();

                            if (data.status === 'success') {
                                const savedId = data.id;
                                const cleanImgUrl = data.img_url || `/diagram_image/${savedId}.png`;
                                const displayImgUrl = cleanImgUrl + '?t=' + Date.now(); // Cache buster query param for instant DOM refresh

                                if (activeDiagramImg) {
                                    // Update existing diagram image element in DOM
                                    activeDiagramImg.setAttribute('src', displayImgUrl);
                                    activeDiagramImg.setAttribute('data-diagram-id', savedId);
                                    activeDiagramImg.classList.add('diagram-image');
                                } else if (window.quillEditor) {
                                    // Insert clean diagram image URL into Quill editor at cursor position
                                    const range = window.quillEditor.getSelection(true);
                                    const index = (range && range.index !== undefined) ? range.index : window.quillEditor.getLength();

                                    window.quillEditor.insertEmbed(index, 'image', displayImgUrl);

                                    // Apply diagram-image class and data-diagram-id attribute to newly inserted image
                                    setTimeout(() => {
                                        const imgs = window.quillEditor.root.querySelectorAll('img');
                                        imgs.forEach(img => {
                                            const src = img.getAttribute('src') || '';
                                            if (src.includes(`/diagram_image/${savedId}.png`)) {
                                                img.classList.add('diagram-image');
                                                img.setAttribute('data-diagram-id', savedId);
                                            }
                                        });
                                    }, 50);

                                    window.quillEditor.setSelection(index + 1);
                                }

                                if (typeof flash === 'function') {
                                    flash('Diagram saved successfully!', 'success');
                                }
                            } else {
                                // Fallback when save_diagram returns status !== 'success'
                                if (typeof flash === 'function') {
                                    flash('Failed to save diagram. Please try again.', 'error');
                                }
                            }
                        } catch (fetchErr) {
                            console.error('Save diagram request failed:', fetchErr);
                            // Fallback when network or server request throws an error
                            if (typeof flash === 'function') {
                                flash('Failed to save diagram. Please try again.', 'error');
                            }
                        }

                        closeDiagramEditor();
                    }
                    // Event 4: User clicked Exit inside Draw.io UI
                    else if (msg.event === 'exit') {
                        closeDiagramEditor();
                    }
                } catch (err) {
                    console.error('Error handling draw.io message:', err);
                }
            });

            /**
             * Initialize event listeners for DOM elements after page load.
             */
            document.addEventListener('DOMContentLoaded', function() {
                // Attach close button click handler
                const closeDiagramBtn = document.getElementById('closeDiagramBtn');
                if (closeDiagramBtn) {
                    closeDiagramBtn.addEventListener('click', closeDiagramEditor);
                }

                // Attach modal fullscreen button click handler
                const diagramFullscreenBtn = document.getElementById('diagramFullscreenBtn');
                if (diagramFullscreenBtn) {
                    diagramFullscreenBtn.addEventListener('click', function() {
                        const modalContent = document.getElementById('diagramModalContent');
                        if (modalContent) {
                            modalContent.classList.toggle('fullscreen');
                        }
                    });
                }

                // Global event delegation for clicking diagram images to re-edit
                document.addEventListener('click', function(e) {
                    const targetImg = e.target.closest('img');
                    if (targetImg && (targetImg.classList.contains('diagram-image') || targetImg.hasAttribute('data-diagram-id') || targetImg.closest('.ql-editor'))) {
                        e.preventDefault();
                        openDiagramEditor(targetImg);
                    }
                });

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            flash('{{message}}','{{category}}');
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            });
        </script>
        <script>
            function toggleReadMode() {
                const backBtn = document.getElementById('backToEditBtn');
                const readNoteContent = document.getElementById('read-note-content');
                const editNoteForm = document.getElementById('edit-note-form');
                const editorWrapper = document.querySelector('.quill-editor-wrapper');

                if (!window.quillEditor || !readNoteContent || !editNoteForm) return;

                // Get the current rich HTML content from the Quill editor
                const content = window.quillEditor.root.innerHTML;
                readNoteContent.innerHTML = content;

                // Hide editor and form, show read view
                editNoteForm.classList.add('hidden');
                if (editorWrapper) editorWrapper.classList.add('hidden');
                readNoteContent.classList.remove('hidden');
                backBtn.classList.remove('hidden');

                // Typeset MathJax on the read view content
                if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
                    MathJax.typesetPromise([readNoteContent]).catch(() => {});
                }
                const images = document.querySelectorAll('#read-note-content img');
                images.forEach(img => {
                    img.classList = []; // Clear existing classes
                    img.classList.add('read-note-image'); // Add the new class
            });
        };
            

            // Set up the back button listener once on page load (avoids listener leak)
            document.addEventListener('DOMContentLoaded', function() {
                const backBtn = document.getElementById('backToEditBtn');
                if (backBtn) {
                    backBtn.addEventListener('click', function() {
                        const readNoteContent = document.getElementById('read-note-content');
                        const editNoteForm = document.getElementById('edit-note-form');
                        const editorWrapper = document.querySelector('.quill-editor-wrapper');

                        editNoteForm.classList.remove('hidden');
                        if (editorWrapper) editorWrapper.classList.remove('hidden');
                        readNoteContent.innerHTML = '';
                        readNoteContent.classList.add('hidden');
                        backBtn.classList.add('hidden');
                    });
                }
            });
            document.addEventListener("DOMContentLoaded", function() {
                
                const textarea = document.getElementById('markdownEditor');
                if (!textarea) return;

                const editorWrapper = document.createElement('div');
                editorWrapper.className = 'quill-editor-wrapper';
                textarea.parentNode.insertBefore(editorWrapper, textarea);

                const quillContainer = document.createElement('div');
                editorWrapper.appendChild(quillContainer);
                textarea.style.display = 'none';

                const themeOptions = {
                    modules: {
                        toolbar: {
                            container: [
                                ['bold', 'italic', 'underline'],
                                [{ 'header': 1 }, { 'header': 2 }],
                                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                                ['clean'],
                                ['diagram'],
                                ['fullscreen'],
                                ['readmode']
                            ],
                            handlers: {
                                'fullscreen': function() {
                                    editorWrapper.classList.toggle('fullscreen-active');
                                    document.body.classList.toggle('editor-lock-scroll');
                                },
                                'readmode': function() {
                                    toggleReadMode();
                                },
                                'diagram': function() {
                                    openDiagramEditor();
                                }
                            }
                        }
                    },
                    placeholder: 'Write your note here...',
                    theme: 'snow'
                };
                const editor = new Quill(quillContainer, themeOptions);
                window.quillEditor = editor;

                const readModeBtn = editorWrapper.querySelector('.ql-readmode');
                if (readModeBtn) {
                    readModeBtn.innerHTML = `
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>`;
                    readModeBtn.title = "Open Read Mode";
                }

                const fullscreenBtn = editorWrapper.querySelector('.ql-fullscreen');
                if (fullscreenBtn) {
                    fullscreenBtn.innerHTML = `
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>`;
                    fullscreenBtn.title = "Toggle Fullscreen Mode";
                }

                const addDiagramBtn = editorWrapper.querySelector('.ql-diagram');
                if (addDiagramBtn) {
                    addDiagramBtn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
                    <circle cx="9" cy="9" r="2"></circle>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
                    <path d="M15 3h6v6"></path>
                </svg>
                `;
                    addDiagramBtn.title = "Add Diagram";
                }

                if (textarea.value) {
                    const htmlFromMarkdown = marked.parse(textarea.value);
                    editor.clipboard.dangerouslyPasteHTML(htmlFromMarkdown);
                }

                const turndownService = new TurndownService();
                textarea.form.addEventListener('submit', function() {
                    const htmlContent = editor.getSemanticHTML();
                    const markdownContent = turndownService.turndown(htmlContent);

                    textarea.value = markdownContent;

                    let htmlHiddenInput = document.getElementById('htmlNoteContent');
                    if (!htmlHiddenInput) {
                        htmlHiddenInput = document.createElement('input');
                        htmlHiddenInput.type = 'hidden';
                        htmlHiddenInput.id = 'htmlNoteContent';
                        htmlHiddenInput.name = 'html_content';
                        textarea.form.appendChild(htmlHiddenInput);
                    }
                    htmlHiddenInput.value = htmlContent;
                });
            });
        </script>
        <script>
            window.addEventListener('pagehide', () => {
  // Target all diagram image elements currently in the editor
  const diagramImgs = document.querySelectorAll('.diagram-image');
  
  // Map their data-diagram-id attributes into a list of integers
  const diagramIds = Array.from(diagramImgs)
    .map(img => img.getAttribute('data-diagram-id'))
    .filter(Boolean)
    .map(id => parseInt(id, 10));

  // Send payload via sendBeacon so it finishes even if the tab closes instantly
  const payload = JSON.stringify({ diagram_ids: diagramIds });
  const blob = new Blob([payload], { type: 'application/json' });
  
  navigator.sendBeacon('/cleanup_draft_diagrams', blob);
});
        </script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                ignoreHtmlClass: 'ql-editor|ql-toolbar'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>    
    </body>
</html>
