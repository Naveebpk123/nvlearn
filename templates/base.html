<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css')}}">
        <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
        <title>{% block title %}NVLearn{% endblock %}</title>
    </head>
    <body class="site-layout">
        <nav>
            <img src="{{url_for('static',filename='assets/logo.png')}}" alt="logo" class="logo" id="logo" title="Toggle sidebar">

            {% if current_user.is_authenticated %}
                <input type="text" placeholder="Search..." class="search-bar" id="searchBar">
            {% endif %}
        </nav>
        <div class="page-layout">
            <aside class="sidebar" id="sidebar">

                <a class="sidebar-item" href="{{url_for('home')}}">
                    🏠 Home
                </a>
                {% if current_user.is_authenticated %}
                    <a class="sidebar-item" href="{{url_for('notes')}}">
                        📚 Notes
                    </a>

                    <a class="sidebar-item" href="{{url_for('note_bin')}}">
                        🗑️ Bin
                    </a>
                    <a class="sidebar-item" href="{{url_for('ai_chat')}}">
                        ✨ NVLearn AI
                    </a>
                    <a class="sidebar-item" href="{{url_for('practice_hub')}}">
                        🎯 Practice Hub
                    </a>
                    <button class="sidebar-item" id="sidebarLogout" >
                        ➜] Logout
                    </button>
                {% else %}
                    <a class="sidebar-item" href="{{url_for('register')}}">
                        📝 Register
                    </a>

                    <a class="sidebar-item" href="{{url_for('login')}}">
                        ➜] Login
                    </a>
                {% endif %}
                <a class="sidebar-item" href="{{url_for('about')}}">
                    ℹ️ About
                </a>
            </aside>
            <main class="content-wrapper sidebar-open" id="contentWrapper">
                <div id="notificationBar"></div>

                {% block content %}
                {% endblock %}
            </main>
        </div>
        <div class="modal-bg" id="modalBackground" style="display:none;">
            <div class="confirm-modal" id="confirmModal">
                <p class="modal-text" id="modalText"></p>
                <div class="modal-btns">
                    <button id="modalConfirmBtn" class="button">Confirm</button>
                    <button id="modalCancelBtn" class="button cancel">Cancel</button>
                </div>
            </div>
        </div>
        <div class="diagram-modal-bg" id="diagramModal" style="display:none;">
            <div class="diagram-modal-content" id="diagramModalContent">
                <div class="diagram-modal-header">
                    <span class="diagram-modal-title">Diagram Editor</span>
                    <div class="diagram-modal-actions">
                        <button type="button" class="diagram-btn" id="diagramFullscreenBtn" title="Toggle Fullscreen">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                            </svg>
                        </button>
                        <button type="button" class="diagram-btn close-btn" id="closeDiagramBtn" title="Close Editor">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="diagram-modal-body">
                    <iframe id="drawioFrame" src="about:blank" title="Draw.io Diagram Editor"></iframe>
                </div>
            </div>
        </div>
        <script src="{{url_for('static',filename='js/script.js')}}"></script>
        <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.3/dist/turndown.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script>
            function openDiagramEditor() {
                const modal = document.getElementById('diagramModal');
                const iframe = document.getElementById('drawioFrame');

                if (!modal || !iframe) return;

                const drawUrl = 'https://embed.diagrams.net/?embed=1&spin=1&proto=json&libraries=1';
                iframe.src = drawUrl;
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }

            function closeDiagramEditor() {
                const modal = document.getElementById('diagramModal');
                const modalContent = document.getElementById('diagramModalContent');
                const iframe = document.getElementById('drawioFrame');

                if (modal) modal.style.display = 'none';
                if (iframe) iframe.src = 'about:blank';
                document.body.style.overflow = '';
                if (modalContent) modalContent.classList.remove('fullscreen');
            }

            window.addEventListener('message', function(event) {
                if (event.origin !== 'https://embed.diagrams.net') return;

                try {
                    const msg = JSON.parse(event.data);
                    const iframe = document.getElementById('drawioFrame');

                    if (msg.event === 'init') {
                        if (iframe && iframe.contentWindow) {
                            iframe.contentWindow.postMessage(JSON.stringify({
                                action: 'load',
                                xml: ''
                            }), '*');
                        }
                    } else if (msg.event === 'save') {
                        console.log('saved');
                        if (iframe && iframe.contentWindow) {
                            iframe.contentWindow.postMessage(JSON.stringify({
                                action: 'export',
                                format: 'xmlsvg'
                            }), '*');
                        }
                    } else if (msg.event === 'export') {
                        console.log('saved');
                    } else if (msg.event === 'exit') {
                        closeDiagramEditor();
                    }
                } catch (err) {
                }
            });

            document.addEventListener('DOMContentLoaded', function() {
                const closeDiagramBtn = document.getElementById('closeDiagramBtn');
                if (closeDiagramBtn) {
                    closeDiagramBtn.addEventListener('click', closeDiagramEditor);
                }

                const diagramFullscreenBtn = document.getElementById('diagramFullscreenBtn');
                if (diagramFullscreenBtn) {
                    diagramFullscreenBtn.addEventListener('click', function() {
                        const modalContent = document.getElementById('diagramModalContent');
                        if (modalContent) {
                            modalContent.classList.toggle('fullscreen');
                        }
                    });
                }

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            flash('{{message}}','{{category}}');
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            });
        </script>
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                const textarea = document.getElementById('markdownEditor');
                if (!textarea) return;

                const editorWrapper = document.createElement('div');
                editorWrapper.className = 'quill-editor-wrapper';
                textarea.parentNode.insertBefore(editorWrapper, textarea);

                const quillContainer = document.createElement('div');
                editorWrapper.appendChild(quillContainer);
                textarea.style.display = 'none';

                const themeOptions = {
                    modules: {
                        toolbar: {
                            container: [
                                ['bold', 'italic', 'underline'],
                                [{ 'header': 1 }, { 'header': 2 }],
                                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                                ['clean'],
                                ['diagram'],
                                ['fullscreen'],
                                ['readmode']
                            ],
                            handlers: {
                                'fullscreen': function() {
                                    editorWrapper.classList.toggle('fullscreen-active');
                                    document.body.classList.toggle('editor-lock-scroll');
                                },
                                'readmode': function() {
                                    window.location.href = "{% if note %}{{url_for('read_note', note_id=note.id)}}{% else %}#{% endif %}";
                                },
                                'diagram': function() {
                                    openDiagramEditor();
                                }
                            }
                        }
                    },
                    placeholder: 'Write your note here...',
                    theme: 'snow'
                };
                const editor = new Quill(quillContainer, themeOptions);

                const readModeBtn = editorWrapper.querySelector('.ql-readmode');
                if (readModeBtn) {
                    readModeBtn.innerHTML = `
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>`;
                    readModeBtn.title = "Open Read Mode";
                }

                const fullscreenBtn = editorWrapper.querySelector('.ql-fullscreen');
                if (fullscreenBtn) {
                    fullscreenBtn.innerHTML = `
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>`;
                    fullscreenBtn.title = "Toggle Fullscreen Mode";
                }

                const addDiagramBtn = editorWrapper.querySelector('.ql-diagram');
                if (addDiagramBtn) {
                    addDiagramBtn.innerHTML = `<svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
                    <circle cx="9" cy="9" r="2"></circle>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
                    <path d="M15 3h6v6"></path>
                </svg>
                `;
                    addDiagramBtn.title = "Add Diagram";
                }

                if (textarea.value) {
                    const htmlFromMarkdown = marked.parse(textarea.value);
                    editor.clipboard.dangerouslyPasteHTML(htmlFromMarkdown);
                }

                const turndownService = new TurndownService();
                textarea.form.addEventListener('submit', function() {
                    const htmlContent = editor.getSemanticHTML();
                    const markdownContent = turndownService.turndown(htmlContent);

                    textarea.value = markdownContent;

                    let htmlHiddenInput = document.getElementById('htmlNoteContent');
                    if (!htmlHiddenInput) {
                        htmlHiddenInput = document.createElement('input');
                        htmlHiddenInput.type = 'hidden';
                        htmlHiddenInput.id = 'htmlNoteContent';
                        htmlHiddenInput.name = 'html_content';
                        textarea.form.appendChild(htmlHiddenInput);
                    }
                    htmlHiddenInput.value = htmlContent;
                });
            });
        </script>

    </body>
</html>
