<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>
            (function() {
                try {
                    var theme = localStorage.getItem('theme') || 'system';
                    var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                    if (isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                } catch(e) {}
            })();
        </script>
        <title>Quiz - NVLearn</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>
    <body class="site-layout">
        <nav>
            <a href="{{ url_for('home') }}" class="button cancel">← Home</a>
            <h2 class="quiz-nav-title">NVLearn Quiz</h2>
            <div class="theme-dropdown-wrapper" id="themeDropdownWrapper">
                <button type="button" class="theme-dropdown-btn" id="themeDropdownBtn" aria-label="Select Theme">
                    <span class="theme-btn-icon" id="themeBtnIcon"></span>
                    <span class="theme-btn-text" id="themeBtnText">System</span>
                    <svg class="theme-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <ul class="theme-dropdown-menu hidden" id="themeDropdownMenu">
                    <li class="theme-option" data-theme="light">
                        <svg class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <span>Light Mode</span>
                    </li>
                    <li class="theme-option" data-theme="dark">
                        <svg class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <span>Dark Mode</span>
                    </li>
                    <li class="theme-option" data-theme="system">
                        <svg class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                            <line x1="8" y1="21" x2="16" y2="21"></line>
                            <line x1="12" y1="17" x2="12" y2="21"></line>
                        </svg>
                        <span>System Default</span>
                    </li>
                </ul>
            </div>
        </nav>
        <main class="content-wrapper quiz-content-wrapper">
            <div class="quiz-container hidden" id="quizContainer">
                <div class="question" id="quizQuestion"></div>

                <div class="options-container" id="optionsContainer">
                    <div class="option" data-index="0"></div>
                    <div class="option" data-index="1"></div>
                    <div class="option" data-index="2"></div>
                    <div class="option" data-index="3"></div>
                </div>

                <div class="quiz-tracker quiz-tracker-text" id="quizTracker"></div>

                <div class="quiz-actions">
                    <button class="button cancel" id="quizPreviousBtn">Previous</button>
                    <button class="button" id="quizNextBtn">Next</button>
                    <button class="button btn-done" id="quizDoneBtn">Done</button>
                </div>
            </div>

            <div id="quizSummary" class="quiz-summary-card">
                <h1 class="quiz-summary-title">🎉 Quiz Completed!</h1>
                <div id="quizScorePercent" class="quiz-score-percent"></div>

                <div class="quiz-stats-row">
                    <div class="stat-box correct">
                        <div class="stat-number" id="correctCount">0</div>
                        <div>Correct</div>
                    </div>
                    <div class="stat-box wrong">
                        <div class="stat-number" id="wrongCount">0</div>
                        <div>Wrong</div>
                    </div>
                    <div class="stat-box unanswered">
                        <div class="stat-number" id="unansweredCount">0</div>
                        <div>Unanswered</div>
                    </div>
                </div>

                <div class="quiz-summary-actions">
                    <button class="button" id="retakeBtn">Retake Quiz</button>
                    <button class="button" id="saveQuizBtn" data-id="{{ quiz_id }}">Save Quiz</button>
                    <a href="{{ url_for('home') }}" class="button cancel">Return Home</a>
                </div>
            </div>

            <div id="quizError" class="quiz-error-card">
                <h2>Failed to load quiz data.</h2>
                <p>The quiz might not exist or you do not have permission to view it.</p>
                <a href="{{ url_for('home') }}" class="button btn-return-home">Return Home</a>
            </div>
        </main>
        <script src="{{ url_for('static', filename='js/script.js') }}"></script>
        <script>
            let quizData = [];
            let userAnswers = {};
            let currentIndex = 0;

            const questionEl = document.getElementById('quizQuestion');
            const optionEls = document.querySelectorAll('.option');
            const trackerEl = document.getElementById('quizTracker');
            const quizPrevBtn = document.getElementById('quizPreviousBtn');
            const quizNextBtn = document.getElementById('quizNextBtn');
            const doneBtn = document.getElementById('quizDoneBtn');
            const quizContainer = document.getElementById('quizContainer');
            const quizSummary = document.getElementById('quizSummary');
            const quizError = document.getElementById('quizError');
            const retakeBtn = document.getElementById('retakeBtn');
            const saveQuizBtn = document.getElementById('saveQuizBtn');


            const correctCountEl = document.getElementById('correctCount');
            const wrongCountEl = document.getElementById('wrongCount');
            const unansweredCountEl = document.getElementById('unansweredCount');
            const quizScorePercentEl = document.getElementById('quizScorePercent');

            function renderQuestion(index) {
                if (!quizData || quizData.length === 0) return;
                const currentQuiz = quizData[index];
                const qText = currentQuiz.q || currentQuiz.question || currentQuiz.question_text || '';
                const options = currentQuiz.options || currentQuiz.choices || currentQuiz.answers || [];
                const ansIdx = currentQuiz.ans !== undefined ? currentQuiz.ans : (currentQuiz.answer !== undefined ? currentQuiz.answer : currentQuiz.correct);

                questionEl.textContent = qText;

                const selectedOption = userAnswers[index];

                optionEls.forEach((optEl, i) => {
                    optEl.className = 'option';
                    if (options && options[i] !== undefined) {
                        optEl.textContent = options[i];
                        optEl.style.display = 'flex';

                        if (selectedOption !== undefined) {
                            optEl.classList.add('disabled');
                            if (i === ansIdx) {
                                optEl.classList.add('correct');
                            } else if (i === selectedOption) {
                                optEl.classList.add('incorrect');
                            }
                        }
                    } else {
                        optEl.style.display = 'none';
                    }
                });

                trackerEl.textContent = `Question ${index + 1} of ${quizData.length}`;
                quizPrevBtn.disabled = index === 0;

                if (index === quizData.length - 1) {
                    quizNextBtn.style.display = 'none';
                    doneBtn.style.display = 'inline-block';
                } else {
                    quizNextBtn.style.display = 'inline-block';
                    doneBtn.style.display = 'none';
                }
            }

            optionEls.forEach(optEl => {
                optEl.addEventListener('click', function() {
                    if (userAnswers[currentIndex] !== undefined) return;

                    const selectedIdx = parseInt(this.dataset.index, 10);
                    userAnswers[currentIndex] = selectedIdx;
                    renderQuestion(currentIndex);
                });
            });

            quizPrevBtn.addEventListener('click', function() {
                if (currentIndex > 0) {
                    currentIndex--;
                    renderQuestion(currentIndex);
                }
            });

            quizNextBtn.addEventListener('click', function() {
                if (currentIndex < quizData.length - 1) {
                    currentIndex++;
                    renderQuestion(currentIndex);
                }
            });

            doneBtn.addEventListener('click', function() {
                let correct = 0;
                let wrong = 0;
                let unanswered = 0;

                quizData.forEach((item, i) => {
                    const userAns = userAnswers[i];
                    const ansIdx = item.ans !== undefined ? item.ans : (item.answer !== undefined ? item.answer : item.correct);
                    if (userAns === undefined) {
                        unanswered++;
                    } else if (userAns === ansIdx) {
                        correct++;
                    } else {
                        wrong++;
                    }
                });

                const scorePercent = Math.round((correct / quizData.length) * 100);

                correctCountEl.textContent = correct;
                wrongCountEl.textContent = wrong;
                unansweredCountEl.textContent = unanswered;
                quizScorePercentEl.textContent = `${scorePercent}% Score`;

                quizContainer.style.display = 'none';
                quizSummary.style.display = 'block';
            });

            retakeBtn.addEventListener('click', function() {
                userAnswers = {};
                currentIndex = 0;
                quizSummary.style.display = 'none';
                quizContainer.style.display = 'block';
                quizContainer.classList.remove('hidden');
                renderQuestion(currentIndex);
            });

            document.addEventListener('DOMContentLoaded', function() {
                const isError = {{ 'true' if error else 'false' }};
                if (isError) {
                    quizError.style.display = 'block';
                    return;
                }

                try {
                    let rawQuizData = {{ quiz_data_json | safe }};
                    if (typeof rawQuizData === 'string') {
                        try { rawQuizData = JSON.parse(rawQuizData); } catch(e) {}
                    }
                    if (typeof rawQuizData === 'string') {
                        try { rawQuizData = JSON.parse(rawQuizData); } catch(e) {}
                    }
                    if (typeof rawQuizData === 'object' && rawQuizData !== null && !Array.isArray(rawQuizData)) {
                        if (Array.isArray(rawQuizData.questions)) rawQuizData = rawQuizData.questions;
                        else if (Array.isArray(rawQuizData.quiz)) rawQuizData = rawQuizData.quiz;
                        else if (Array.isArray(rawQuizData.data)) rawQuizData = rawQuizData.data;
                        else if (Array.isArray(rawQuizData.items)) rawQuizData = rawQuizData.items;
                    }
                    quizData = rawQuizData;

                    if (!quizData || !Array.isArray(quizData) || quizData.length === 0) {
                        quizError.style.display = 'block';
                    } else {
                        quizContainer.classList.remove('hidden');
                        renderQuestion(currentIndex);
                    }
                } catch (err) {
                    console.error("Quiz rendering error:", err);
                    quizError.style.display = 'block';
                }

                const saveQuizBtnEl = document.getElementById('saveQuizBtn');
                if (saveQuizBtnEl) {
                    saveQuizBtnEl.addEventListener('click', async function() {
                        const response = await fetch(`/save-quiz/${saveQuizBtnEl.dataset.id}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                total_questions: quizData.length,
                                correct_answers: parseInt(correctCountEl.textContent),
                                incorrect_answers: parseInt(wrongCountEl.textContent),
                                percentage_score: parseFloat(quizScorePercentEl.textContent.replace('% Score','').trim())
                            })
                        });
                        const responseJSON = await response.json();
                        if (responseJSON.status == 'saved') {
                            saveQuizBtnEl.disabled = true;
                            flash('Saved quiz', 'success');
                        } else {
                            flash('Unable to save quiz', 'error');
                        }
                    });
                }
            });
        </script>
        <script>
            document.addEventListener('DOMContentLoaded',function(){
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            flash('{{message}}','{{category}}');
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            })
        </script>
    </body>
</html>
