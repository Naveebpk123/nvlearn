<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - NVLearn</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="site-layout">
    <nav>
        <a href="{{ url_for('home') }}" class="button cancel">← Home</a>
        <h2 class="quiz-nav-title">NVLearn Quiz</h2>
    </nav>
    <main class="content-wrapper quiz-content-wrapper">
        <div class="quiz-container hidden" id="quizContainer">
            <div class="question" id="quizQuestion"></div>

            <div class="options-container" id="optionsContainer">
                <div class="option" data-index="0"></div>
                <div class="option" data-index="1"></div>
                <div class="option" data-index="2"></div>
                <div class="option" data-index="3"></div>
            </div>

            <div class="quiz-tracker quiz-tracker-text" id="quizTracker"></div>

            <div class="quiz-actions">
                <button class="button cancel" id="quizPreviousBtn">Previous</button>
                <button class="button" id="quizNextBtn">Next</button>
                <button class="button btn-done" id="quizDoneBtn">Done</button>
            </div>
        </div>

        <div id="quizSummary" class="quiz-summary-card">
            <h1 class="quiz-summary-title">🎉 Quiz Completed!</h1>
            <div id="quizScorePercent" class="quiz-score-percent"></div>
            
            <div class="quiz-stats-row">
                <div class="stat-box correct">
                    <div class="stat-number" id="correctCount">0</div>
                    <div>Correct</div>
                </div>
                <div class="stat-box wrong">
                    <div class="stat-number" id="wrongCount">0</div>
                    <div>Wrong</div>
                </div>
                <div class="stat-box unanswered">
                    <div class="stat-number" id="unansweredCount">0</div>
                    <div>Unanswered</div>
                </div>
            </div>

            <div class="quiz-summary-actions">
                <button class="button" id="retakeBtn">Retake Quiz</button>
                <button class="button" id="saveQuizBtn">Save Quiz</button>
                <a href="{{ url_for('home') }}" class="button cancel">Return Home</a>
            </div>
        </div>

        <div id="quizError" class="quiz-error-card">
            <h2>Failed to load quiz data.</h2>
            <p>The quiz might not exist or you do not have permission to view it.</p>
            <a href="{{ url_for('home') }}" class="button btn-return-home">Return Home</a>
        </div>
    </main>

    <script>
        let quizData = [];
        let userAnswers = {};
        let currentIndex = 0;

        const questionEl = document.getElementById('quizQuestion');
        const optionEls = document.querySelectorAll('.option');
        const trackerEl = document.getElementById('quizTracker');
        const prevBtn = document.getElementById('quizPreviousBtn');
        const nextBtn = document.getElementById('quizNextBtn');
        const doneBtn = document.getElementById('quizDoneBtn');
        const quizContainer = document.getElementById('quizContainer');
        const quizSummary = document.getElementById('quizSummary');
        const quizError = document.getElementById('quizError');
        const retakeBtn = document.getElementById('retakeBtn');

        const correctCountEl = document.getElementById('correctCount');
        const wrongCountEl = document.getElementById('wrongCount');
        const unansweredCountEl = document.getElementById('unansweredCount');
        const quizScorePercentEl = document.getElementById('quizScorePercent');

        function renderQuestion(index) {
            if (!quizData || quizData.length === 0) return;
            const currentQuiz = quizData[index];
            questionEl.textContent = currentQuiz.q;

            const selectedOption = userAnswers[index];

            optionEls.forEach((optEl, i) => {
                optEl.className = 'option';
                if (currentQuiz.options && currentQuiz.options[i] !== undefined) {
                    optEl.textContent = currentQuiz.options[i];
                    optEl.style.display = 'flex';

                    if (selectedOption !== undefined) {
                        optEl.classList.add('disabled');
                        if (i === currentQuiz.ans) {
                            optEl.classList.add('correct');
                        } else if (i === selectedOption) {
                            optEl.classList.add('incorrect');
                        }
                    }
                } else {
                    optEl.style.display = 'none';
                }
            });

            trackerEl.textContent = `Question ${index + 1} of ${quizData.length}`;
            prevBtn.disabled = index === 0;

            if (index === quizData.length - 1) {
                nextBtn.style.display = 'none';
                doneBtn.style.display = 'inline-block';
            } else {
                nextBtn.style.display = 'inline-block';
                doneBtn.style.display = 'none';
            }
        }

        optionEls.forEach(optEl => {
            optEl.addEventListener('click', function() {
                if (userAnswers[currentIndex] !== undefined) return;

                const selectedIdx = parseInt(this.dataset.index, 10);
                userAnswers[currentIndex] = selectedIdx;
                renderQuestion(currentIndex);
            });
        });

        prevBtn.addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
            }
        });

        nextBtn.addEventListener('click', function() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
            }
        });

        doneBtn.addEventListener('click', function() {
            let correct = 0;
            let wrong = 0;
            let unanswered = 0;

            quizData.forEach((item, i) => {
                const userAns = userAnswers[i];
                if (userAns === undefined) {
                    unanswered++;
                } else if (userAns === item.ans) {
                    correct++;
                } else {
                    wrong++;
                }
            });

            const scorePercent = Math.round((correct / quizData.length) * 100);

            correctCountEl.textContent = correct;
            wrongCountEl.textContent = wrong;
            unansweredCountEl.textContent = unanswered;
            quizScorePercentEl.textContent = `${scorePercent}% Score`;

            quizContainer.style.display = 'none';
            quizSummary.style.display = 'block';
        });

        retakeBtn.addEventListener('click', function() {
            userAnswers = {};
            currentIndex = 0;
            quizSummary.style.display = 'none';
            quizContainer.style.display = 'block';
            quizContainer.classList.remove('hidden');
            renderQuestion(currentIndex);
        });

        document.addEventListener('DOMContentLoaded', async function() {
            const quizId = '{{ quiz_id }}';
            try {
                const response = await fetch(`/get-quiz-data/${quizId}`, { method: 'POST' });
                if (!response.ok) {
                    throw new Error('Failed response');
                }
                quizData = await response.json();
                
                if (!quizData || !Array.isArray(quizData) || quizData.length === 0) {
                    quizError.style.display = 'block';
                } else {
                    quizContainer.classList.remove('hidden');
                    renderQuestion(currentIndex);
                }
            } catch (err) {
                quizError.style.display = 'block';
            }
        });
    </script>
</body>
</html>
