{% extends "base.html" %}
{% block title %}AI Chat{% endblock %}
{% block content %}
    <header>
        <h1>{{welcome_message}}</h1>
    </header>
    <div class="user-input-box" id="userInputContainer">
        <textarea id="user-input" placeholder="Ask anything..."></textarea>
    </div>
    <div class="chat-loading hidden" id="chatLoading" role="status" aria-live="polite" aria-label="Working">
        <span class="chat-loading-spinner" aria-hidden="true"></span>
        <span>Working</span>
    </div>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                processHtmlClass: 'math|arithmatex'
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endblock %}
<script>
window.addEventListener('pagehide', () => {
                if (window.mermaid_notes){
                    const payload = JSON.stringify({ note_ids: Array.from(sessionCreatedDiagramIds) });
                    const blob = new Blob([payload], { type: 'application/json' });
                    navigator.sendBeacon('/mark_mermaid_pending', blob);
                };
            });
</script>
